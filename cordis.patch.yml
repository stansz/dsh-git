# Bundle patch for dsh-git.
#
# One inserted row. It mounts this package's Host half, which contributes:
#
#   ctx.tools.register()          -> the `git` tool (status, start, commit,
#                                    push, sync, pr, merge, finish)
#   ctx.commands.register()       -> /git
#   ctx.on('tools/pre-execute')   -> the redirect guard for raw git in bash
#   ctx.on('agent/turn-stopping') -> commit and push each turn's changes
#
# The row id is unique to this bundle, so nothing shipped is overridden and no
# base row's config has to be restated. Delete this entry to remove every
# contribution at once.
#
# Nothing here needs a config block: every field has a default. Two ways to change
# one: the Configure page this bundle's browser half ships (Plugins -> dsh-git ->
# Configure), or overriding this row in the profile's own patch layer, which survives
# Harness upgrades and is read when the plugin mounts. The page writes through the
# settings namespace the row's Config schema serves, and every field is volatile(),
# which is what lets a saved change reach the next call instead of the next restart.
- insert:
    - id: dsh-git
      name: 'dsh-git'
