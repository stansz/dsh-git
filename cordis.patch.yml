# Bundle patch for dsh-git.
#
# One inserted row. It mounts this package's Host half, which contributes:
#
# This package needs the dsh-git-core bundle installed beside it: lib/core-loader.mjs
# resolves the shared library from the sibling directory or the profile's node_modules,
# and fails with a sentence naming what is missing when neither has it.
#
#   ctx.tools.register()          -> the `git` tool (clone, init, status, save,
#                                    publish, sync, pr, merge, finish, prune)
#   ctx.commands.register()       -> /git
#   ctx.on('tools/pre-execute')   -> the guard for raw git in the shell, and the
#                                    settle timer that ends a turn's edits
#   ctx.on('agent/turn-stopping') -> commit the paths this session recorded, and
#                                    push when the branch is safe
#   ctx.on('session/event')       -> the same sync, from the log's turn/end
#
# The row id is unique to this bundle, so nothing shipped is overridden and no
# base row's config has to be restated. Delete this entry to remove every
# contribution at once.
#
# Nothing here needs a config block: every field has a default. Change one by overriding
# this row in the profile's own patch layer, which survives Harness upgrades and is read
# when the plugin mounts — so a change needs a restart. There is deliberately no Configure
# page: the one that existed wrote into this file, with values nobody asked for, and its
# effect arrived at the next start anyway.
- insert:
    - id: dsh-git
      name: 'dsh-git'
