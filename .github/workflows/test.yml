name: test

# Disabled for now: the test matrix and the auto-moving `latest` tag were slowing
# down small changes and pulling focus away from the actual work. Re-enable with:
#   on:
#     push:
#       branches: [main]
#     pull_request:
# The jobs below are untouched and will run as-is when the trigger is restored.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The bug class this code keeps hitting is path identity, and that is exactly
        # what differs between platforms - so the matrix is the point, not decoration.
        os: [ubuntu-latest, macos-latest]
        # 22 is the oldest LTS that supports the glob in node --test (added in 21).
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No npm install: the bundle's one dependency is loaded defensively through
      # createRequire, the suite mocks nothing and needs no third-party code, and an
      # install would make the suite depend on a registry it does not use.
      - run: node --version && git --version
      # The runner context is not available in a job-level env block, only in a step's -
      # using it there was the workflow-file error that made the first run produce no jobs.
      - run: npm test
        env:
          # Keep scratch out of the checkout and inside the runner's temp dir; the suite
          # removes it itself, which keeps a leak visible rather than buried in the tree.
          DSH_GIT_TEST_ROOT: ${{ runner.temp }}/dsh-git-tests
          GIT_TERMINAL_PROMPT: "0"

  # A ref that is always current, for a machine that wants to name one.
  #
  # An unpinned `github:` spec already follows the default branch, so a fresh install
  # needs nothing here. What needs a job is the other half: a machine that wants a
  # stable NAME rather than a date, and a person who does not want to maintain a
  # version number to have one. So `latest` moves onto every green push to main - it
  # is the newest revision that passed the matrix above, on both platforms, and it
  # moves only after that matrix passes.
  #
  # `latest` is the one tag in this repository that is MEANT to move. A version tag
  # must never be re-pointed: a pinned install would silently become different code,
  # which is the property the pin exists to provide. If version tags are ever added,
  # they are published once, from a commit that already passed here.
  latest:
    name: move the latest tag
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: point latest at this commit
        run: |
          git tag -f latest
          git push --force origin latest
          # Read it back rather than trust the push: a green check here has to mean the
          # tag really is on this commit.
          test "$(git ls-remote --tags origin refs/tags/latest | cut -f1)" = "$(git rev-parse HEAD)"