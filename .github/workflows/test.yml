name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The bug class this code keeps hitting is path identity, and that is exactly
        # what differs between platforms - so the matrix is the point, not decoration.
        os: [ubuntu-latest, macos-latest]
        # 22 is the oldest LTS that supports the glob in node --test (added in 21).
        node: [22, 24]
    env:
      # Keep scratch out of the checkout and inside the runner's temp dir; the suite
      # cleans it up itself, and this makes that visible if it ever fails to.
      DSH_GIT_TEST_ROOT: ${{ runner.temp }}/dsh-git-tests
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No npm install: the bundle's one dependency is loaded defensively through
      # createRequire, the suite mocks nothing and needs no third-party code, and an
      # install would make the suite depend on a registry it does not use.
      - run: node --version && git --version
      - run: npm test
