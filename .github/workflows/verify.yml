name: verify

# Every suite in scripts/ is part of the verification story for this bundle, and
# they were all written to run anywhere: no network, no credentials, no services.
# `scripts/e2e.mjs` clones a local bare repository rather than talking to GitHub,
# so pushes, upstream tracking and ahead/behind are exercised through real git and
# a real transport without a token in sight.
#
# The matrix is the point of running this at all. The verification behind this
# bundle was done on one machine — macOS, git 2.54, /private symlinks — and the
# failure mode this code keeps hitting is path identity, which is *exactly* what
# differs between platforms. ubuntu has no /private prefix, so the same realpath
# logic takes a different branch there. Once the two runners are green they stop
# being a formality and start being the place a regression is caught.
#
# Deliberately absent: a build step (there is nothing to build) and a dependency
# install (there are no dependencies). lib/*.mjs import only `node:` builtins.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Not fail-fast: a macOS-only path bug and a Linux-only git-version bug are
      # different findings, and seeing both is worth the extra minutes.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Recorded, not asserted: the suites depend on specific git behaviour
      # (`status --porcelain=v2 --branch`, `worktree list --porcelain`, the
      # `-z` forms), and knowing which version a red run used is the difference
      # between a five-minute fix and an afternoon.
      - name: Report the toolchain
        run: |
          node --version
          git --version
          echo "platform: ${{ runner.os }}"

      # The plugin declares exactly one dependency, `@deepseek-ai/schemastery`,
      # and loads it defensively: under a `link:` install a bundle's
      # dependencies are not hoisted, so the plugin must mount and work without
      # it. That means there are two states to verify, and each is a different
      # branch of the loader.
      #
      # Without it — every job — the plugin loads, registers its tool and runs
      # with every setting at its default. With it, one job, the Config schema
      # resolves and the Configure page exists. Testing only the first would let
      # a broken schema field reach users silently.
      - name: Install the one declared dependency (Configuration schema path)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm install --no-save --no-audit --no-fund @deepseek-ai/schemastery@3.18.4

      - name: Guard classification (187 assertions)
        run: node scripts/guard-test.mjs

      # Portability is a property CI can actually check better than one machine
      # can: it asserts that the bundle follows the deployment's $DSH_HOME, bakes
      # in no authoring-machine path, ships every file it imports, and loads with
      # no node_modules at all.
      - name: Portability — deployment home, no machine paths, loads bare
        run: node scripts/portability-check.mjs

      # The worktree rule has two directions and both matter: firing when it
      # should is the feature, firing when it should not is how a guard gets
      # switched off. Most of these assertions are the second kind.
      - name: Worktree enforcement — refuses what it should, and nothing else
        run: node scripts/worktree-guard-test.mjs

      # The notice a failed sync injects is durable session-log content, so a
      # malformed one does not merely fail to appear — it makes the whole
      # session unloadable. This locks down that regression from a real
      # corrupted session: the inbox fold keys pending messages by `id`, so two
      # notices without one collide on `undefined` and the projection throws.
      # `source` alone shipped once as the fix and was not enough.
      - name: Sync notice — a durable message needs a unique id and a source
        run: node scripts/notice-test.mjs

      # Runs this workflow's own file through scripts/workflow-check.mjs: real
      # runner labels, every referenced script present, no step that runs
      # nothing. A malformed workflow is the one failure the workflow itself
      # cannot report.
      - name: Workflow file is valid and every step does something
        run: node scripts/workflow-check.mjs

      # Before the end-to-end suite because it is fast and its failures are
      # unambiguous: it checks that every tool result is lossless JSON and
      # matches the declared output schema, which the Harness enforces at
      # dispatch time. A failure here means the model would get an error instead
      # of a result.
      - name: Tool contract — lossless JSON and output schema
        run: node scripts/check.mjs

      - name: End-to-end — worktree, commit, push, sync, turn sync, guard
        run: node scripts/e2e.mjs

      # The bundle's own report: every patch row must resolve, and the plugin's
      # tool definitions must satisfy the tools contract when the real tools
      # layer executes them. A bundle that loads in the profile but cannot be
      # installed elsewhere is a bundle that only works on the machine it was
      # written on.
      - name: Bundle loadability
        run: node -e "import('./index.js').then(async (m) => { if (typeof m.apply !== 'function') throw new Error('index.js exports no apply()'); console.log('index.js loads and exports apply()'); })"

      - name: No runtime dependencies
        run: |
          node -e "
          const pkg = require('./package.json');
          const deps = Object.keys(pkg.dependencies ?? {}).filter((name) => name !== '@deepseek-ai/schemastery');
          if (deps.length > 0) throw new Error('unexpected runtime dependencies: ' + deps.join(', '));
          console.log('only the defensively-loaded schema package is declared');
          "
